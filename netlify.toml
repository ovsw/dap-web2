[build]
  command = "npm run generate"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Force hosted policies even if a previous build contains legacy CMS pages.
[[redirects]]
  from = "/terms-and-conditions"
  to = "https://www.iubenda.com/terms-and-conditions/41165067"
  status = 301
  force = true

[[redirects]]
  from = "/terms-and-conditions/"
  to = "https://www.iubenda.com/terms-and-conditions/41165067"
  status = 301
  force = true

[[redirects]]
  from = "/privacy-policy"
  to = "https://www.iubenda.com/privacy-policy/41165067"
  status = 301
  force = true

[[redirects]]
  from = "/privacy-policy/"
  to = "https://www.iubenda.com/privacy-policy/41165067"
  status = 301
  force = true

[[redirects]]
  from = "/cookie-policy"
  to = "https://www.iubenda.com/privacy-policy/41165067/cookie-policy"
  status = 301
  force = true

[[redirects]]
  from = "/cookie-policy/"
  to = "https://www.iubenda.com/privacy-policy/41165067/cookie-policy"
  status = 301
  force = true

[[redirects]]
  from = "/events/the-season-finale-harvestfest/"
  to = "/events/annual-harvestfest/"
  status = 301
  force = true

[[redirects]]
  from = "https://dap-web2.netlify.app/*"
  to = "https://www.mydelgrossopark.com/:splat"
  status = 301
  force = true
